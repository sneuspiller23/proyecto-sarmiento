{% extends 'base.html' %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="tarjeta p-4">
      <h1 class="h4 mb-1">Ingresar</h1>
      <p class="text-muted">Registrar una vez, consultar según el rol y conservar el historial.</p>
      <form method="post" data-un-envio>
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="usuario">Usuario</label>
          <input class="form-control" id="usuario" name="usuario" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="clave">Contraseña</label>
          <input class="form-control" id="clave" name="clave" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" data-enviando="Ingresando…">Ingresar</button>
      </form>
    </div>
    <p class="small text-muted text-center">Demo: admin, directora, preceptor o docente · contraseña 1234</p>
  </div>
</div>
{% endblock %}
